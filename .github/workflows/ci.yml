name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - run: cobol2rust examples/hello.cbl --output build/hello-rust
      - run: cargo check --manifest-path build/hello-rust/Cargo.toml
