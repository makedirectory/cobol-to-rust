[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cobol-to-rust"
version = "0.1.0"
description = "Educational COBOL-to-Rust transpiler scaffold"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Make Directory Developers, LLC", email = "andrew@mk-dir.com" }]
keywords = ["cobol", "rust", "transpiler", "compiler", "modernization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Compilers",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1", "mypy>=1.11,<2"]

[project.urls]
Homepage = "https://github.com/makedirectory/cobol-to-rust"
Issues = "https://github.com/makedirectory/cobol-to-rust/issues"

[project.scripts]
cobol2rust = "cobol2rust.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
