[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cobol-to-rust"
version = "0.1.0"
description = "Educational COBOL-to-Rust transpiler scaffold"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
cobol2rust = "cobol2rust.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
